name: macOS
on: [push, pull_request]
jobs:
  verify:
    # Swift 6.3 and older crash while compiling the app. Xcode 27 has its own runner image.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: ./scripts/build
      - name: Run isolated tests
        run: ./scripts/test
      - name: Package the release ZIP
        run: ./scripts/package
  thread-sanitizer:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated tests with Thread Sanitizer
        run: ./scripts/test --sanitize=thread
