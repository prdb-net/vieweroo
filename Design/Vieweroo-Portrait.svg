<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
     viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Vieweroo — portrait study</title>
  <desc id="desc">Close-up of a golden kangaroo raising mint-green binoculars. The round lenses echo the two o's in Vieweroo.</desc>
  <defs>
    <linearGradient id="pine" x2=".8" y2="1">
      <stop stop-color="#19524e"/>
      <stop offset="1" stop-color="#092f32"/>
    </linearGradient>
    <linearGradient id="coat" x1=".2" x2=".65" y2="1">
      <stop stop-color="#ffe09c"/>
      <stop offset=".55" stop-color="#f4b763"/>
      <stop offset="1" stop-color="#e59445"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="14" y="14" width="228" height="228" rx="51"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="14" y="14" width="228" height="228" fill="url(#pine)"/>
    <g id="portrait">
      <!-- The far ear stands upright while the near ear listens outward. -->
      <path fill="#df9b51" d="M119 104C104 83 99 47 109 23c19 16 30 48 21 76z"/>
      <path fill="#995b3d" d="M120 89c-9-17-13-38-10-52 10 15 16 37 13 52z"/>
      <path fill="#cf8848" d="M114 201c10-15 36-25 54-46 9-10 15-22 20-32l10-1c-2 19-12 41-25 58-12 17-25 26-39 32z"/>
      <path fill="url(#coat)" d="M17 248c3-30 21-47 37-67 13-16 22-35 27-59l4-17C66 96 48 72 46 43c24 5 48 26 57 49 8-6 16-9 26-8 16 1 24 11 31 24l12 19 20 12c6 7 3 16-3 22-8 9-20 13-32 12-11 13-17 35-16 55l2 25z"/>
      <path fill="#b16b40" d="M88 96C70 84 57 65 53 52c17 9 32 27 39 44z"/>
      <!-- The pale muzzle projects beyond the glass and continues down the throat. -->
      <path fill="#ffdfa2" d="M118 130c13-3 25-10 36-18l17 17 22 10c7 3 6 11 2 18-8 14-24 19-37 17-14 18-18 47-13 74h-31c12-18 19-36 17-53-1-12-9-23-15-32-9-14-9-27 2-33z"/>
      <path fill="#413f32" d="M181 140c5-3 13-5 18-3 4 2 2 8-1 13-3 5-7 8-11 8-4-3-7-8-8-12-1-3 0-5 2-6z"/>
      <path d="M169 165q10 2 17-4" fill="none" stroke="#a66e43" stroke-width="2.3" stroke-linecap="round"/>
    </g>
    <g id="binoculars" transform="rotate(-9 155 119)">
      <!-- The offset barrels have a common bridge just above the lens midline. -->
      <path fill="#4b8a81" d="M145 82c2-9 10-14 17-12l40 11-4 43-42-13c-9-4-14-16-11-29z"/>
      <ellipse cx="198" cy="105" rx="26" ry="28" fill="#a6dbc2" stroke="#153f3e" stroke-width="4"/>
      <ellipse cx="198" cy="105" rx="17.5" ry="19" fill="#245c5b"/>
      <path fill="#75b1a4" d="M184 108c-1-9 4-17 13-19l-12 23z"/>
      <path fill="#558e81" d="M150 96l36-1 2 15-34 5z"/>
      <path fill="#326762" d="M100 101c3-12 11-21 24-19l36 8-5 62-39-14c-13-5-20-20-16-37z"/>
      <path fill="#68a295" d="M101 98c5-12 13-18 23-16l37 8-11 10-48 2z"/>
      <ellipse cx="153" cy="123" rx="32" ry="34" fill="#c2ebcc" stroke="#123b3b" stroke-width="4.5"/>
      <ellipse cx="153" cy="123" rx="22" ry="23.5" fill="#194e52"/>
      <path fill="#85c5b4" d="M135 124c0-11 7-20 18-21l-17 28z"/>
    </g>
    <g id="near-paw">
      <!-- The hooked wrist and elbow keep clear of both lens openings. -->
      <path fill="#bc783f" d="M95 180c-7 13-7 32 2 42 7 8 16 6 24-2 16-17 25-44 29-66l-13-6c-8 18-16 34-25 45z"/>
      <path fill="#facb80" d="M96 175c-7 5-7 23-2 35 5 12 14 16 22 7 12-13 22-37 28-57 7-2 12-8 12-15 0-3-3-4-5-1l-5 6 2-10c1-4-3-6-5-2l-5 9v-5c0-4-4-4-5 0l-3 14c-4 10-12 24-20 32 1-9-1-19-6-20-3-1-6 2-8 7z"/>
    </g>
  </g>
</svg>
