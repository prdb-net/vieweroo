<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Vieweroo</title>
  <desc id="desc">A golden kangaroo sits upright and looks up through binoculars. The two mint lenses form the oo in Vieweroo.</desc>
  <defs>
    <linearGradient id="pine" x1="0" y1="0" x2=".6" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#164b48"/>
      <stop offset="1" stop-color="#092f32"/>
    </linearGradient>
    <linearGradient id="fur" x2=".7" y2="1">
      <stop stop-color="#ffe09c"/>
      <stop offset=".55" stop-color="#f4b763"/>
      <stop offset="1" stop-color="#e59445"/>
    </linearGradient>
  </defs>
  <rect x="14" y="14" width="228" height="228" rx="51" fill="url(#pine)"/>
  <g id="kangaroo">
    <!-- Far ear, hind leg and foot. -->
    <path fill="#d8914b" d="M149 89C138 79 134 62 139 39c13 8 21 26 18 43z"/>
    <path fill="#8e5036" d="M149 78c-5-9-8-20-8-29 8 8 12 20 11 29z"/>
    <path fill="#c57e41" d="M115 158c12-4 27 0 29 12 2 11-8 19-14 22l29 1c9 0 15 3 18 8h-55c-9 0-13-4-13-11z"/>
    <!-- Far paw wraps around the underside of the outer barrel. -->
    <path fill="#d48a46" d="M148 137c12 0 28-12 40-30 2-5 4-12 7-15 2-2 4-1 3 2l-1 5 5-6c2-2 5 0 3 3l-4 8c-2 4-5 7-8 8-9 19-29 38-43 38z"/>
    <!-- One contour connects the tapered tail, haunch, chest and long muzzle. -->
    <path fill="url(#fur)" d="M34 133c12 22 27 32 48 36 1-18 7-31 23-46 13-12 20-21 22-33-13-6-23-21-25-42 18 5 31 18 35 32 8-4 18-4 26 1l11 12 8 4c3 7-1 15-8 19-7 4-14 3-19 5-5 9 1 23-7 40-5 12-14 21-25 27l-12 9 23 4c9 2 15 5 17 10h-46c-10 0-19-4-23-11l-3-8c-24-8-39-28-46-57-.5-2 0-3 1-2z"/>
    <path fill="#a6603a" d="M129 82c-10-6-18-16-22-27 12 6 20 16 22 27z"/>
    <path fill="#ffe0a2" d="M140 103c10 0 19-3 25-7l9 10 13 3c3 6 1 13-6 17-6 4-15 3-23 2-6 3-6 15-8 26-1-17-9-24-13-34-3-9-2-15 3-17z"/>
    <path fill="#4b4235" d="M180 109l10-1c2 4 0 10-6 13-4-1-6-5-6-8z"/>
    <path d="M173 124q5 1 9-2" fill="none" stroke="#b27b50" stroke-width="1.5" stroke-linecap="round"/>
    <!-- The inner bend separates the powerful thigh from the long resting foot. -->
    <path fill="#c67c3e" d="M101 143c16-11 33 0 32 14-1 13-16 21-28 31-4 3-6 7-5 10-6-5-6-11 0-17 9-9 21-17 22-26 1-10-9-16-21-12z"/>
    <path fill="#ffdc98" d="M35 136c12 20 27 29 47 33l1 6c-19-5-36-18-48-39z"/>

  </g>
  <g id="binoculars" transform="translate(4 -9) rotate(-12 176 98)">
    <!-- Tapered barrels point out of the picture, with the far barrel set back. -->
    <path fill="#58978b" d="M163 74c0-6 8-10 14-6l27 13-7 24-28-13c-6-3-9-11-6-18z"/>
    <ellipse cx="197" cy="93" rx="17" ry="19" fill="#a9e0c7" stroke="#113b3a" stroke-width="3"/>
    <ellipse cx="197" cy="93" rx="11" ry="12.5" fill="#1e5757"/>
    <path fill="#77b5a8" d="M189 93c1-7 5-11 10-10l-10 14z"/>
    <path fill="#639f90" d="M166 90l22-1 2 10-20 5z"/>
    <path fill="#39736d" d="M136 84c2-7 8-10 15-8l26 8-3 34-27-8c-10-3-14-15-11-26z"/>
    <path fill="#71a99a" d="M137 83c3-6 9-9 15-7l22 7-7 6-29-5z"/>
    <ellipse cx="170" cy="101" rx="20" ry="21" fill="#c3edd0" stroke="#123c3b" stroke-width="3.5"/>
    <ellipse cx="170" cy="101" rx="13" ry="14" fill="#194e52"/>
    <path fill="#85c8b7" d="M160 102c0-7 4-13 11-13l-11 17z"/>
  </g>
  <!-- Near arm and fingers grip the eyepiece. -->
  <path fill="#c17b40" d="M137 130c-5 6-6 19 1 23 12 6 23-17 24-30l-7-3c-4 10-9 18-13 19z"/>
  <path fill="#f8c779" d="M137 125c-6 2-6 14-1 21 3 5 7 6 11 3 8-7 16-28 19-37 4-1 7-5 7-8 0-2-2-3-3-2l-4 4 1-6c0-3-3-3-4-1l-3 6-1-3c-1-2-3-1-3 1l-1 8c-2 6-10 20-14 24 0-6-1-10-4-10z"/>
</svg>
